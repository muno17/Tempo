
applications:
  tempo:
    type: "python:3.14"

    relationships:
      database: "db:postgresql"

    web:
      upstream:
        socket_family: unix
      commands:
        start: "gunicorn -w 4 -b unix:$SOCKET Tempo.wsgi:application"
      locations:
        "/":
          passthru: true
        "/static":
          root: "static"
          expires: 1h
          allow: true

    disk: 512

    mounts:
      "logs":
        source: local
        source_path: logs

    hooks:
      build: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_remote.txt
        mkdir -p logs
        python manage.py collectstatic --no-input
      deploy: |
        python manage.py migrate --no-input

services:
  db:
    type: postgresql:14
    disk: 1024

routes:
  "https://{default}/":
    type: upstream
    upstream: "tempo:http"

  "https://www.{default}/":
    type: redirect
    to: "https://{default}/"