{% extends 'base.html' %}

{% block content %}
<h1>Activities</h1>

<table>
    <thead>
        <tr>
            <th>Date</th>
            <th>Title</th>
            <th>Distance</th>
            <th>Time</th>
            <th>Pace</th>
        </tr>
    </thead>
    <tbody>
        {% for activity in activities %}
        <tr>
            <td>{{ activity.timestamp|date:"m/d/Y" }}</td>
            <td>{{ activity.title  }}</td>
            <td>{{ activity.mileage }} mi</td>
            <td>{{ activity.time }}</td>
            <td>{{ activity.pace }}/mi</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
