{% extends 'base.html' %}

{% block content %}
    <div class="stats-block form-block">
        <form method="post">
            {% csrf_token %}
            <div class="main-header">Update Block</div>
            {{ form.as_p }}
            <div class="form-buttons">
                <button type="submit" class="save">Create</button>
                <div class="button cancel">
                    <a href="{% url 'block-list' %}">Cancel</a>
            </div>
        </div>
        </form>
    </div>
{% endblock content %}
