{% extends 'base.html' %}

{% block content %}
    <div class="stats-block form-block">
        <form method="post">
            {% csrf_token %}
            <div class="main-header">Update Block</div>
            <div class="button">
                <a href="{% url 'block-detail' current_block.id%}">Go back to Block</a>
            </div>
            {{ form.as_p }}
            <button type="submit" class="save">Save</button>
        </form>
    </div>
{% endblock content %}
