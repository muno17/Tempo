{% extends 'base.html' %}

{% block content %}
    <h1>Are you sure you want to delete {{ activity.title }}?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'activity-list' %}">Cancel and go back</a>
    </form>
{% endblock content %}
